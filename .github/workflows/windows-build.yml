name: Build Windows ZIP

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Build test project
        run: dotnet build ./tests/BehaviorTests/BehaviorTests.csproj --configuration Release

      - name: Publish self-contained Windows ZIP
        id: package
        run: |
          $package = & ./scripts/Publish-Windows.ps1
          "zip-path=$($package.ZipPath)" >> $env:GITHUB_OUTPUT

      - name: Verify packaged executable
        run: ./scripts/Test-WindowsPackage.ps1 -ZipPath '${{ steps.package.outputs.zip-path }}'

      - name: Upload ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.zip-path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
